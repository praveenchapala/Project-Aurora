name: Backend CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend-test:
    name: Build and Test Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: aurora_ci
          POSTGRES_USER: aurora
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aurora -d aurora_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: apps/backend

    env:
      DB_URL: jdbc:postgresql://localhost:5432/aurora_ci
      DB_USERNAME: aurora
      DB_PASSWORD: ci_test_password
      JWT_SECRET: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      JWT_EXPIRATION: 86400000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: apps/backend/pom.xml

      - name: Verify Java and Maven
        run: |
          java -version
          ./mvnw -version

      - name: Build and run tests
        run: ./mvnw --batch-mode --no-transfer-progress clean verify
